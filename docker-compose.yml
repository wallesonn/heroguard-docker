#Este repositorio é publico 
#Stack do HeroGuard: aplicação (export estático servido por nginx), API de
# cadastro (Node + pg) e Postgres local. O Traefik já roda na VPS (fora desta
# stack) e encaminha heroguard.my para o serviço app via labels na rede
# externa "web" — a mesma configuração usada pelas demais stacks da VPS
# (inlaudo). O nginx faz proxy de /api/ para o serviço api.
#
# Build/publish da imagem: ./build.sh vX.Y.Z na raiz do repo do app.
# Deploy: Portainer (web editor ou este repo via GitHub) ou CLI na VPS.
# Sem bloco build de propósito: a imagem é sempre puxada pronta do Docker Hub.
#
# O Postgres é usado pela API de cadastro: o formulário da landing grava na
# tabela "waitlist" (schema criado pela própria API na inicialização).

services:
  app:
    image: ${DOCKER_IMAGE:-wallesonnn/heroguard-app:latest}
    container_name: heroguard-app
    restart: unless-stopped
    expose:
      - "80"
    environment:
      # O runtime do site é nginx (estático): não acessa o banco. A conexão
      # com o Postgres é feita apenas pelo serviço "api".
      NODE_ENV: production
    networks:
      - default
      - web
    labels:
      - "app=heroguard"
      - "domain=heroguard.my"
      - "service=heroguard-app"
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.heroguard.rule=Host(`heroguard.my`) || Host(`www.heroguard.my`)"
      - "traefik.http.routers.heroguard.entrypoints=websecure"
      - "traefik.http.routers.heroguard.tls=true"
      - "traefik.http.routers.heroguard.tls.certresolver=lets-encrypt"
      - "traefik.http.services.heroguard.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    image: ${API_IMAGE:-wallesonnn/heroguard-api:latest}
    container_name: heroguard-api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-heroguard}:${POSTGRES_PASSWORD:-heroguard}@db:5432/${POSTGRES_DB:-heroguard}
      PORT: "3000"
      NODE_ENV: production
    networks:
      # Só na rede interna: o acesso público chega pelo proxy do nginx (app).
      - default
    labels:
      - "traefik.enable=false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17-alpine
    container_name: heroguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heroguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heroguard}
      POSTGRES_DB: ${POSTGRES_DB:-heroguard}
    # Mapeamento de porta DESABILITADO (2026-10-19): a VPS já tem outro
    # Postgres publicado na 5432 do host. O acesso é só pelas redes Docker:
    # "db" para os serviços da stack e "heroguard-db" para o n8n. Para
    # acesso a partir do host (ferramentas locais), descomente abaixo usando
    # uma porta livre via POSTGRES_PORT (ex.: 5433).
    #ports:
    #  - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      default:
      # Também na rede do Traefik: o n8n (que já roda nesta VPS na mesma
      # rede "web") consulta a tabela waitlist pelo host "heroguard-db".
      # Não há exposição à internet — o Postgres não tem porta publicada e
      # a label abaixo mantém o Traefik fora do serviço.
      web:
        aliases:
          - heroguard-db
    labels:
      # Impede o Traefik (exposedByDefault) de tentar rotear o Postgres.
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heroguard} -d ${POSTGRES_DB:-heroguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  default:
  # Rede externa do Traefik já existente na VPS (a mesma do inlaudo)
  web:
    external: true